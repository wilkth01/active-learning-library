name = "all-brainstorm"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Which origins may call this Worker. Add your GitHub Pages origin (no path, no trailing slash).
ALLOWED_ORIGINS = "https://active-learning-library.tomwilk.net,https://wilkth01.github.io,http://localhost:8080"
# The model and effort used for every request.
MODEL = "claude-opus-5-5"
EFFORT = "low"

# Per-visitor limit: at most 6 requests a minute from one IP address.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

# The API key is a secret, never a var:  npx wrangler secret put ANTHROPIC_API_KEY
